<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – Bhavani Hardware &amp; Paints, Pollachi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container nav">
      <a class="logo" href="index.html">Bhavani Hardware &amp; Paints<span>Pollachi</span></a>
      <button class="menu-btn" aria-label="Menu">&#9776;</button>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="brands.html">Brands</a></li>
        <li><a href="about.html">About</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </header>

  <div class="page-title"><div class="container"><h1>Contact us</h1><p>Visit the shop or call for prices and availability.</p></div></div>

  <section>
    <div class="container contact-box">
      <div>
        <h2>Visit us</h2>
        <p><strong data-s="shopName"></strong><br><span data-s="address"></span></p>
        <p><strong>Phone:</strong> <a data-tel="phone1" href="#"></a> <a data-tel="phone2" href="#"></a></p>
        <p><strong>Open:</strong> <span data-s="hours"></span></p>
        <p><strong>Instagram:</strong> <a id="ig-link" href="#" target="_blank" rel="noopener">Follow us</a></p>
        <p><a class="btn" id="directions" href="#" target="_blank" rel="noopener">Get directions</a></p>
        <br>
        <h2>Send an enquiry</h2>
        <form id="contact-form">
          <label>Name <input type="text" name="name" required></label>
          <label>Phone or email <input type="text" name="contact" required></label>
          <label>What do you need? <textarea name="message" rows="4" required></textarea></label>
          <button class="btn" type="submit">Send on WhatsApp</button>
          <p class="form-msg" role="status"></p>
        </form>
      </div>
      <iframe id="map" title="Shop location map" loading="lazy"></iframe>
    </div>
  </section>

  <footer></footer>
  <script src="js/main.js"></script>
</body>
</html>
